<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h2>Expense Tracker</h2>

    <!-- 1. Total Balance Section -->
    <div class="balance-box">
      <h4>Your Balance</h4>
      <h1 id="balance">Rs. 0.00</h1>
    </div>

    <!-- 2. Income & Expense Summary Box -->
    <div class="inc-exp-container">
      <div>
        <h4>Income</h4>
        <p id="money-plus" class="money plus">+Rs. 0.00</p>
      </div>
      <div>
        <h4>Expense</h4>
        <p id="money-minus" class="money minus">-Rs. 0.00</p>
      </div>
    </div>

    <!-- 3. Transaction History List -->
    <h3>History</h3>
    <ul id="list" class="list">
      <!-- JavaScript yahan transactions add karega -->
    </ul>

    <!-- 4. Add New Transaction Form -->
    <h3>Add New Transaction</h3>
    <form id="form">
      <div class="form-control">
        <label for="text">Description (e.g. Salary, Chai, Petrol)</label>
        <input type="text" id="text" placeholder="Enter description..." required>
      </div>
      <div class="form-control">
        <label for="amount">Amount <br> (Negative = Expense, Positive = Income)</label>
        <input type="number" id="amount" placeholder="Enter amount..." required>
      </div>
      <button class="btn">Add Transaction</button>
    </form>
  </div>

  <script src="project6.js"></script>
</body>
</html>
